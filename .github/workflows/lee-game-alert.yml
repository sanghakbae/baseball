name: Lee Game Alert

on:
  schedule:
    # 12시간마다 (UTC 00:00 / 12:00 = KST 09:00 / 21:00)
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '전송 없이 확인만'
        type: boolean
        default: false

concurrency:
  group: lee-game-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Lee's upcoming game & notify
        env:
          # 미설정 시 스크립트의 기본값(클라이언트 번들에 이미 공개된 값) 사용
          CHAT_WEBHOOK: ${{ secrets.CHAT_WEBHOOK }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node scripts/lee-game-alert.mjs
